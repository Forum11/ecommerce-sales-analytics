version: 2

models:
  - name: gld_fact_orders
    description: >
      Fact table at the order-item grain. Each row represents one item
      within an order, with foreign keys to all dimension tables and
      all measurable facts (price, freight, delivery, reviews).
    columns:
      - name: order_item_key
        description: "Surrogate key (order_id + order_item_id)."
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('gld_dim_customers')
              field: customer_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('gld_dim_products')
              field: product_key
      - name: seller_key
        tests:
          - not_null
          - relationships:
              to: ref('gld_dim_sellers')
              field: seller_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('gld_dim_date')
              field: date_key
      - name: price
        tests:
          - not_null

  - name: gld_dim_customers
    description: >
      Customer dimension with demographics and lifetime metrics.
      Includes customer segmentation (One-Time, Repeat, Loyal).
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null

  - name: gld_dim_products
    description: >
      Product dimension with English category names and sales metrics.
    columns:
      - name: product_key
        tests:
          - unique
          - not_null

  - name: gld_dim_sellers
    description: >
      Seller dimension with location and performance metrics.
      Includes seller tier classification (Bronze through Platinum).
    columns:
      - name: seller_key
        tests:
          - unique
          - not_null

  - name: gld_dim_date
    description: >
      Date dimension covering 2016-2018. One row per calendar day
      with year, quarter, month, week, and weekend flag attributes.
    columns:
      - name: date_key
        tests:
          - unique
          - not_null
