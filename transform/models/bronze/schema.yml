version: 2

models:
  - name: brz_orders
    description: "Cleaned orders with properly typed timestamps."
    columns:
      - name: order_id
        description: "Unique order identifier."
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: order_status
        tests:
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']

  - name: brz_customers
    description: "Cleaned customers with standardized city/state."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: brz_products
    description: "Cleaned products with corrected column names."
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: brz_sellers
    description: "Cleaned sellers with standardized city/state."
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: brz_order_items
    description: "Cleaned order line items."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null

  - name: brz_order_payments
    description: "Cleaned payment records."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_type
        tests:
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']

  - name: brz_order_reviews
    description: "Cleaned order reviews."
    columns:
      - name: review_id
        tests:
          - not_null
      - name: review_score
        tests:
          - not_null
